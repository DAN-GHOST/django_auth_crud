<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
</head>
<body>
    {% extends 'index.html' %}
    {% block content %}
    <main class="container">
        <div class="row">
            <section class="col-md-4 offset-md-4 mt-5">
                <form action="/signin/" method="POST" class="card card-body">
                    <h1 class="text-center">Signin</h1>
                    <h1>{{error}}</h1>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username"> User Name:</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="write your username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password"> Password:</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="write your password" required>
                    </div>
            
                    <button type="submit" class="btn btn-primary"> Ingresar</button>
                </form>
            </section>
        </div>
    </main>
    {% endblock %}
</body>
</html>
